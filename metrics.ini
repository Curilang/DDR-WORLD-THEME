[MusicWheel]
FadeSeconds=1
# The original (60 fps video) jumps to the new row in 1 or 2 frames and then stays still: with 0.06 this theme kept
# drifting for another quarter of a second after the jump. It was 0.15 at first.
SwitchSeconds=0.15
ScrollBarHeight=1000
ScrollBarOnCommand=diffusealpha,1;y,SCREEN_TOP-250;
# With a pack open, the wheel shows only that pack (its title and its songs); the other packs come back when it
# is closed. Set to false to see all the packs with the open one expanded.
OnlyShowActiveSection=true
HideActiveSectionTitle=false
ShowRoulette=false
ShowRandom=false

# The songs of the open pack are a grid of three per row: Scripts/08 WheelLayout.lua puts every item in its cell and
# makes the rows scroll like the arcade (the row stays still while the cursor goes along it). The old column is the
# fallback (no pack open, no layout).
ItemTransformFunction=function(self,offsetFromCenter,itemIndex,numItems) \
	if WheelLayout then \
		WheelLayout.Transform(self,offsetFromCenter); \
	else \
		self:z(1-math.abs(offsetFromCenter)); \
		self:x((offsetFromCenter*0)); \
		self:y( offsetFromCenter*105 ); \
	end; \
	end

# The wheel only has items for the songs around the cursor (half of this number on each side). Scrolling fast, the layout
# (Scripts/08 WheelLayout.lua) shows rows that are a little behind the cursor and the engine loads the next cards late:
# with few items the rows at the edge were empty or showed old cards. 18 was too few; more items = a bigger margin.
NumWheelItems=20
MusicWheelSortOnCommand=
MusicWheelSortOffCommand=
MusicWheelItemSortOnCommand=zoomy,0;linear,0.15;zoomy,1;sleep,0.02
MusicWheelItemSortOffCommand=linear,0.15;zoomy,0;sleep,0.02

